# MyAgent 模型配置
# llama.cpp (llama-server) 启动后在 localhost:8000 提供 OpenAI 兼容接口

profiles:
  - id: "local-qwen2.5-14b"
    provider: "llama_cpp"
    base_url: "http://localhost:8000/v1"
    model_name: "Qwen2.5-14B-Instruct"
    api_key: "EMPTY"
    capabilities:
      - chat
      - tool_calling
      - streaming
    privacy_tag: "local_only"          # 强制本地推理，断网可用
    max_model_len: 32768
    default_temperature: 0.7
    default_max_tokens: 4096

  # 预留云端模型 (非核心功能用，如皮肤生成)
  - id: "cloud-zhipu"
    provider: "openai_compatible"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    model_name: "glm-4-flash"
    api_key: "${ZHIPU_API_KEY}"        # 从环境变量读取
    capabilities:
      - chat
      - streaming
    privacy_tag: "cloud_allowed"       # 非核心功能，断网时不可用
    default_temperature: 0.9
    default_max_tokens: 2048
