# Nginx 反向代理 — 单端口暴露
# 前端静态资源 + FastAPI 后端 + llama.cpp 推理 全部通过 80 端口访问
#
# 部署时由 install.sh 复制到 /etc/nginx/nginx.conf
# install.sh 会自动替换 __FRONTEND_DIST__ 为实际路径

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;  # 允许上传图片(皮肤取色)

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        # 前端静态资源 (构建产物)
        location / {
            root __FRONTEND_DIST__;
            try_files $uri $uri/ /index.html;
        }

        # FastAPI 后端 API
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket 代理 (流式对话)
        location /api/agents/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # llama.cpp OpenAI 兼容接口 (仅内部使用，不对外暴露)
        location /v1/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
