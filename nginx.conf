# Nginx 反向代理 — 单端口暴露
# 前端静态资源 + FastAPI 后端 + llama.cpp 推理 全部通过 80 端口访问
#
# 部署时由 install.sh 复制到 /etc/nginx/nginx.conf
# install.sh 会自动替换 __FRONTEND_DIST__ 为实际路径

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 50M;  # 允许上传图片(皮肤取色)

    # WebSocket 支持
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;
        # 经隧道(frp)暴露时,禁止 Nginx 发出带 localhost:<port> 的绝对重定向,
        # 否则浏览器会去请求自己机器的 8088 端口导致 /api 全空。改为相对重定向。
        # 注意: 部分 Nginx 版本对 absolute_redirect off 不生效, 见下方 location = /api/agents 精确匹配作为兜底。
        absolute_redirect off;

        # 前端静态资源 (构建产物)
        location / {
            root __FRONTEND_DIST__;
            try_files $uri $uri/ /index.html;
        }

        # FastAPI 后端 API
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # 精确匹配 /api/agents (无斜杠), 直接代理避免 Nginx 补斜杠 301 重定向。
        # 前端 fetch('/api/agents') 后若被 301 到 http://localhost:8088/api/agents/ (绝对网址),
        # 浏览器会打到用户本机而非云端 → 智能体列表为空 → 面板空白、发不出消息。
        # 此规则从根上消除该 301, 让 /api/agents 直接返回数据。
        location = /api/agents {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # WebSocket 代理 (流式对话)
        location /api/agents/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }

        # llama.cpp OpenAI 兼容接口 (仅内部使用，不对外暴露)
        location /v1/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
        }
    }
}
