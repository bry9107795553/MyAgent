<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MyAgent 系统面板</title>
<style>
:root {
  --bg-0: #0f0f1a; --bg-1: #1a1a2e; --bg-2: #16213e;
  --text-0: #e8e8f0; --text-1: #c8d8e8; --text-2: #8aa8c8;
  --accent: #6c5ce7; --accent-2: #00cec9;
  --border: rgba(255,255,255,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-0); color: var(--text-0);
  font-family: "SF Pro Text", "PingFang SC", -apple-system, sans-serif;
  font-size: 14px; padding: 24px; min-height: 100vh;
}
h1 { font-size: 20px; margin-bottom: 16px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
h2 { font-size: 15px; margin-bottom: 12px; color: var(--text-1); border-bottom: 1px solid var(--border); padding-bottom: 6px; }
section { background: var(--bg-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.card { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 140px; flex: 1; }
.card .label { font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em; }
.card .value { font-size: 14px; color: var(--text-0); margin-top: 4px; font-weight: 500; }
.tag { display: inline-block; padding: 2px 8px; background: rgba(108,92,231,0.12); border: 1px solid rgba(108,92,231,0.25); border-radius: 10px; font-size: 11px; color: var(--accent); margin: 2px; }
.tag-2 { background: rgba(0,206,201,0.12); border-color: rgba(0,206,201,0.25); color: var(--accent-2); }
.tag-3 { background: rgba(255,255,255,0.05); border-color: var(--border); color: var(--text-2); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.wg { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.wg-name { font-weight: 600; margin-bottom: 4px; color: var(--text-0); }
.wg-meta { font-size: 11px; color: var(--text-2); margin-bottom: 6px; }
.wg-desc { font-size: 12px; color: var(--text-2); margin-bottom: 8px; line-height: 1.5; }
.role-group { margin-bottom: 12px; }
.group-title { font-size: 11px; color: var(--accent-2); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; font-weight: 600; }
.role { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 6px; margin: 2px; }
.role .rn { color: var(--text-0); font-weight: 500; }
.role .ri { color: var(--text-2); font-size: 11px; font-family: monospace; }
.empty { color: var(--text-2); font-style: italic; padding: 12px; }
.btn { display: inline-block; padding: 6px 12px; background: var(--accent); color: white; border-radius: 6px; text-decoration: none; font-size: 12px; border: none; cursor: pointer; }
pre { background: var(--bg-0); padding: 10px; border-radius: 6px; color: var(--accent-2); font-size: 12px; overflow-x: auto; }
.endpoint { font-size: 12px; color: var(--text-2); font-family: monospace; margin-top: 6px; }
.on { color: #00b894; }
.off { color: #e8463a; }
.footer { color: var(--text-2); font-size: 12px; margin-top: 16px; }
small.kw { font-size: 10px; padding: 1px 6px; background: rgba(108,92,231,0.1); color: var(--accent); border-radius: 4px; margin-right: 3px; }
</style>
</head>
<body>
<h1>🔧 MyAgent 系统面板</h1>
<div style="margin-bottom:16px;color:var(--text-2);font-size:12px;" id="api-base">API: ...</div>

<section>
<h2>系统状态</h2>
<div class="row" id="status-cards">加载中...</div>
</section>

<section>
<h2>角色清单 (<span id="role-count">0</span>)</h2>
<div id="role-content">加载中...</div>
</section>

<section>
<h2>工作组 (<span id="wg-count">0</span>)</h2>
<div id="wg-content">加载中...</div>
</section>

<section>
<h2>智能体 (<span id="agent-count">0</span>)</h2>
<div id="agent-content">加载中...</div>
</section>

<section>
<h2>模块模板</h2>
<div id="module-content">加载中...</div>
</section>

<section>
<h2>皮肤</h2>
<div id="skin-content">加载中...</div>
</section>

<div class="footer">
数据来源: 公网 API。所有调用走 GET，请求失败会显示在卡片里。
</div>

<script>
const API_BASE = window.location.protocol === 'https:'
  ? 'https://rc-8ac0748899fa49e1.radeon.firstdg.ai'
  : 'http://localhost:8088';
document.getElementById('api-base').textContent = 'API: ' + API_BASE;

async function fetchJSON(path) {
  try {
    const res = await fetch(API_BASE + path);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return await res.json();
  } catch (e) {
    return { _error: e.message };
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function init() {
  // 1. System overview
  const sys = await fetchJSON('/api/system');
  const statusDiv = document.getElementById('status-cards');
  if (sys._error) {
    statusDiv.innerHTML = `<div class="card off">⚠ /api/system 不可用 (${esc(sys._error)}) — 后端未更新到带 system_routes 的版本,稍后会回退到 health endpoint</div>`;
  } else {
    const gpu = sys.gpu || {};
    statusDiv.innerHTML = `
      <div class="card"><div class="label">推理引擎</div><div class="value ${gpu.llm_available ? 'on' : 'off'}">${gpu.llm_available ? '🟢 在线' : '🔴 离线'}</div></div>
      <div class="card"><div class="label">加载模型</div><div class="value">${esc(gpu.model)}</div></div>
      <div class="card"><div class="label">GPU 模式</div><div class="value">${esc(gpu.routing || gpu.mode || '-')}</div></div>
      <div class="card"><div class="label">系统规模</div><div class="value">${sys.role_count} 角色 · ${sys.workgroup_count} 工作组</div></div>
    `;
  }

  // 2. Roles
  const roleCount = sys.role_count || 0;
  document.getElementById('role-count').textContent = roleCount;
  const roleDiv = document.getElementById('role-content');
  if (sys._error || !sys.categories) {
    // Fallback: use role_pool.json directly... no, just read from workgroups to infer
    roleDiv.innerHTML = `<div class="empty">/api/system 不可用 — 角色数据需要从 /api/system 读取;角色定义在 data/role_pool.json(18 角色)</div>`;
  } else {
    const groupLabels = { general: '通用', dev: '开发团队', logistics: '后勤', management: '管理' };
    let html = '';
    for (const [group, roles] of Object.entries(sys.categories || {})) {
      html += `<div class="role-group"><div class="group-title">${esc(groupLabels[group] || group)} (${roles.length})</div>`;
      roles.forEach(r => {
        html += `<span class="role"><span class="rn">${esc(r.name)}</span><span class="ri">${esc(r.id)}</span></span>`;
      });
      html += `</div>`;
    }
    roleDiv.innerHTML = html;
  }

  // 3. Workgroups
  const wgCount = sys.workgroup_count || 0;
  document.getElementById('wg-count').textContent = wgCount;
  const wgDiv = document.getElementById('wg-content');
  const wgs = sys.workgroups || [];
  if (wgs.length === 0) {
    wgDiv.innerHTML = `<div class="empty">未加载工作组</div>`;
  } else {
    let html = '<div class="grid">';
    wgs.forEach(wg => {
      html += `<div class="wg">
        <div class="wg-name">${esc(wg.name || wg.id)}</div>
        <div class="wg-meta">${wg.pipeline_steps || 0} 步 · ${(wg.members || []).length} 成员</div>
        <div class="wg-desc">${esc(wg.description || '')}</div>
        <div>${(wg.trigger_keywords || []).slice(0,5).map(k => `<small class="kw">${esc(k)}</small>`).join('')}</div>
      </div>`;
    });
    html += '</div>';
    wgDiv.innerHTML = html;
  }

  // 4. Agents
  const agents = await fetchJSON('/api/agents');
  const agentDiv = document.getElementById('agent-content');
  if (agents._error) {
    agentDiv.innerHTML = `<div class="empty off">⚠ ${esc(agents._error)}</div>`;
  } else {
    document.getElementById('agent-count').textContent = (agents.agents || []).length;
    agentDiv.innerHTML = (agents.agents || []).map(a =>
      `<div class="wg"><div class="wg-name">${esc(a.name || a.agent_id)}</div><div class="wg-desc">${esc(a.description || '')}</div></div>`
    ).join('') || '<div class="empty">无</div>';
  }

  // 5. Module templates
  const mods = await fetchJSON('/api/modules/templates');
  const modDiv = document.getElementById('module-content');
  if (mods._error) {
    modDiv.innerHTML = `<div class="empty off">⚠ ${esc(mods._error)}</div>`;
  } else {
    const list = mods.templates || mods.modules || (Array.isArray(mods) ? mods : []);
    modDiv.innerHTML = `<div class="card"><div class="label">模板数</div><div class="value">${list.length}</div></div>
      <div class="card"><div class="label">示例</div><div class="value">${list.slice(0,3).map(m => esc(m.name || m.id || m)).join(', ')}</div></div>`;
  }

  // 6. Skins
  const skins = await fetchJSON('/api/skins');
  const skinDiv = document.getElementById('skin-content');
  if (skins._error) {
    skinDiv.innerHTML = `<div class="empty off">⚠ ${esc(skins._error)}</div>`;
  } else {
    const list = skins.skins || (Array.isArray(skins) ? skins : []);
    skinDiv.innerHTML = `<div class="row">${list.map(s =>
      `<div class="card"><div class="label">${esc(s.id || s.name)}</div><div class="value">${esc(s.name || '')}</div></div>`
    ).join('')}</div>`;
  }
}

init();
</script>
</body>
</html>
