# MyAgent 前端容器 Nginx 配置（容器内专用）
#
# 与仓库根目录的 nginx.conf 区别：
#   - 根目录 nginx.conf 用于 AMD 云实例裸机部署（install.sh 复制到 /etc/nginx，
#     反代 127.0.0.1:8080 / 127.0.0.1:8000）
#   - 本文件用于 docker compose 模拟环境，反代到 compose 服务名 backend:8080
# 两者互不覆盖。

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;   # 皮肤取色要上传图片

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vue Router history 模式回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带 hash，可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # WebSocket 流式对话 —— 必须放在 /api/ 之前，
    # 否则会被下面的普通 proxy 规则吃掉，Upgrade 头丢失导致握手失败
    location /api/agents/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;          # 流式 token 不缓冲，否则前端看不到打字机效果
        proxy_read_timeout 600s;      # 14B 模型长流水线可能跑很久
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # 说明：推理端点 /v1 **不对外暴露**。
    # 后端通过 localhost:8000 直连推理容器（共享网络命名空间），
    # 浏览器侧无需、也不应访问推理服务。
}
